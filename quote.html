<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your quote · Innovation Plumbing and Design</title>
<style>
  :root { --ink:#1f2328; --muted:#5b636d; --line:#e3e6ea; --bg:#f5f6f8; --card:#fff; --brand:#e0672b; --brand-ink:#fff; --ok:#1d7a3e; --warn:#a33b00; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  header.card { display: flex; gap: 14px; align-items: center; }
  header img { width: 76px; height: 76px; object-fit: contain; flex: none; }
  header .co { min-width: 0; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  header .co b { display: block; color: var(--ink); font-size: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .meta { color: var(--muted); font-size: 14px; }
  .meta div { overflow-wrap: anywhere; }
  .desc { white-space: pre-wrap; margin-top: 10px; }
  td.ln { white-space: pre-line; }
  .desc-h { margin: 14px 0 0; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  td.q { width: 48px; text-align: center; color: var(--muted); }
  td.a { width: 104px; text-align: right; white-space: nowrap; }
  .tot { display: flex; justify-content: space-between; padding: 6px 0; }
  .tot.big { font-size: 19px; font-weight: 700; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
  .tot.dep { color: var(--warn); font-weight: 600; }
  ul.key { margin: 0; padding-left: 20px; }
  ul.key li { margin-bottom: 6px; }
  button, .btn { font: inherit; border-radius: 10px; padding: 13px 16px; border: 1px solid var(--line); background: #fff; color: var(--ink); width: 100%; cursor: pointer; touch-action: manipulation; }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 700; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > * { flex: 1; }
  label.tick { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; }
  label.tick input { width: 24px; height: 24px; flex: none; margin: 0; }
  input[type=text] { font: inherit; font-size: 16px; width: 100%; padding: 12px; border: 1px solid #c9ced4; border-radius: 10px; }
  .note { font-size: 13.5px; color: var(--muted); }
  .msg { margin-top: 10px; font-weight: 600; }
  .msg.err { color: var(--warn); }
  .done { border-color: #9fd3b0; background: #f1faf4; }
  .done b { color: var(--ok); }
  #terms { position: fixed; inset: 0; background: #fff; z-index: 10; display: none; flex-direction: column; }
  #terms.open { display: flex; }
  #terms .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  #terms .bar button { width: auto; padding: 10px 16px; }
  #terms .body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; width: 100%; }
  #terms h3 { font-size: 16px; margin: 18px 0 6px; }
  #terms p { margin: 0 0 8px; }
  #terms ul { margin: 0 0 8px; padding-left: 20px; }
  .center { text-align: center; padding: 40px 16px; color: var(--muted); }
  /* photos and mock-ups */
  .gal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 700px) { .gal { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .gal figure { margin: 0; min-width: 0; }
  button.img { padding: 0; border: 0; background: #eef0f3; border-radius: 10px; overflow: hidden; display: block; width: 100%; position: relative; }
  .gal button.img { aspect-ratio: 4 / 3; }
  button.img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  button.img.mock img { object-fit: contain; background: #fff; }
  .badge { position: absolute; left: 6px; top: 6px; background: rgba(31,35,40,.85); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  figcaption { font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }
  .mocknote { font-size: 12.5px; color: var(--warn); margin-top: 2px; }
  .lthumbs { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .plinks { margin-top: 0; font-size: 14px; }
  tr.haslinks td { border-bottom: 0; padding-bottom: 2px; }
  label.optl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--brand); margin-bottom: 4px; }
  label.optl input { width: 24px; height: 24px; margin: 0; flex: none; }
  tr.off td { color: var(--muted); }
  tr.off td.a { text-decoration: line-through; }
  .opthint { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  tr.plrow td { padding-top: 0; }
  .plinks .plh { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .plinks a { display: block; color: #1a56b0; padding: 4px 0; overflow-wrap: anywhere; text-decoration: underline; }
  .plinks a span { color: var(--muted); font-size: 12.5px; text-decoration: none; }
  .lthumbs button.img { width: 64px; height: 64px; }
  .lthumbs .badge { font-size: 10px; padding: 1px 5px; left: 3px; top: 3px; }
  #viewer { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; color: #fff; }
  #viewer.open { display: flex; }
  #viewer .vbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  #viewer .vbar button { width: auto; padding: 9px 16px; background: #222; color: #fff; border-color: #444; }
  #viewer .stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #viewer .stage img { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; will-change: transform; }
  #viewer .cap { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); font-size: 15px; min-height: 52px; overflow-wrap: anywhere; }
  #viewer .cap .mocknote { color: #ffb27a; }
  #viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.5); font-size: 22px; line-height: 44px; }
  #viewer .prev { left: 8px; } #viewer .next { right: 8px; }
.practice{background:#fde68a;color:#78350f;border:2px dashed #b45309;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-weight:700;font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Loading your quote…</div></div>

<div id="terms" role="dialog" aria-modal="true" aria-labelledby="terms-title">
  <div class="bar"><b id="terms-title">Terms and conditions</b><button type="button" id="terms-close">Close</button></div>
  <div class="body" id="terms-body"></div>
</div>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="vbar"><span id="v-count"></span><button type="button" id="v-close">Close</button></div>
  <div class="stage" id="v-stage"><img id="v-img" alt=""><button type="button" class="nav prev" id="v-prev" aria-label="Previous">&#8249;</button><button type="button" class="nav next" id="v-next" aria-label="Next">&#8250;</button></div>
  <div class="cap" id="v-cap"></div>
</div>

<script>
// Client quote page (Part B). Reads the quote from our server and the terms from terms/ipd-terms.txt + ipd-terms.json
// (the version history lives there). Records: page opened, full terms opened, PDF downloaded, signed. No costs are ever
// sent to this page. Nothing here writes to ServiceM8.
const API = /^ipd-app-preview/.test(location.hostname) ? 'https://ipd-proxy-auth-test.onrender.com' : (window.__PROXY || 'https://ipd-proxy-server.onrender.com');
const id = (location.hash || '').replace(/^#/, '').trim();
const staffPreview = /[?&]staff=1\b/.test(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const aud = n => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const day = iso => new Date(iso).toLocaleDateString('en-AU', { timeZone: 'Australia/Brisbane', day: 'numeric', month: 'long', year: 'numeric' });
const when = iso => new Date(iso).toLocaleString('en-AU', { timeZone: 'Australia/Brisbane', day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' });
let Q = null, TERMS = null, TERMS_TEXT = '', TERMS_SHA = '', LOGO = null;
// SHOWN = the terms this page shows: the current ones, or (once signed) the exact version the client signed under,
// read from terms/history so an old signature always shows the wording it was given.
let SHOWN = null;
const tday = d => day(d + 'T00:00:00+10:00');
async function shownTerms() {
  const v = Q.signed && Q.signed.termsVersion, cur = TERMS.current;
  const h = v && v !== cur.version ? (TERMS.history || []).find(x => x.version === v) : null;
  if (!h) return { version: cur.version, date: cur.date, keyTerms: TERMS.keyTerms, text: TERMS_TEXT };
  let text = `The full wording of terms version ${h.version} could not be loaded just now. Please reload the page, or contact us for a copy.`; try { text = await fetch(h.file, { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.text(); }); } catch (e) {}
  return { version: h.version, date: h.date, keyTerms: h.keyTerms || TERMS.keyTerms, text };
}
function showTermsPanel() {
  $('#terms-body').innerHTML = termsHtml(SHOWN.text) + `<p class="note">Version ${SHOWN.version}, ${tday(SHOWN.date)}. ${esc(TERMS.business.name)} · QBCC Licence ${esc(TERMS.business.qbcc)}</p>`;
}
const signedLine = s => `Accepted by ${s.name} on ${when(s.at)}, under terms version ${s.termsVersion}${s.termsDate ? ' of ' + tday(s.termsDate) : ''}.`;
const stages = q => Array.isArray(q.stages) ? q.stages : [];
// Photos and mock-ups: whole-quote ones first, then each line's, in the tech's order. Served only through this quote's link.
const MOCK_NOTE = 'For illustration only, final layout may vary.';
let ALL = [], LINKS = [], CHOICE = null;
// Options the client ticks: required lines + ticked options make the total (deposit 20% over $1,000, as the server works it out).
const r2 = v => Math.round(v * 100) / 100;
// a % discount line is worked out on what the client chose; stages kept as shares follow the choice (as the server does)
const lineOn = (l, i) => !l.optional || CHOICE.has(i);
const baseNow = () => r2(Q.lines.reduce((t, l, i) => t + (lineOn(l, i) && !(l.discountPct > 0) ? l.qty * l.priceInc : 0), 0));
const lineAmt = (l, i) => (l.discountPct > 0 ? -r2(baseNow() * l.discountPct / 100) : l.qty * l.priceInc);
function totalsNow() {
  const q = Q, total = r2(q.lines.reduce((t, l, i) => t + (lineOn(l, i) ? lineAmt(l, i) : 0), 0)), deposit = total > 1000 ? r2(total * 0.2) : 0;
  let st = stages(q).map(x => ({ name: x.name, amountInc: x.amountInc }));
  if (!q.signed && stages(q).some(x => x.share > 0)) { let left = r2(total - deposit); st = stages(q).map((x, i, a) => { const v = i === a.length - 1 ? left : r2((total - deposit) * x.share); left = r2(left - v); return { name: x.name, amountInc: v }; }); }
  else if (q.signed && Array.isArray(q.signed.stages)) st = q.signed.stages;
  return { totalInc: total, gstInc: r2(total / 11), deposit, stages: st };
}
const scheduleHtml = () => { const t = totalsNow(); return `<table><tbody>
        ${t.deposit ? `<tr><td>Deposit, due on acceptance</td><td class="q"></td><td class="a">${aud(t.deposit)}</td></tr>` : ''}
        ${t.stages.map((x, i) => `<tr><td>Stage ${i + 1}: ${esc(x.name)}<div class="note">Invoiced when this stage is complete</div></td><td class="q"></td><td class="a">${aud(x.amountInc)}</td></tr>`).join('')}
      </tbody></table>
      <div class="tot"><span>Total (inc GST)</span><span>${aud(t.totalInc)}</span></div>`; };
const totalsHtml = () => { const t = totalsNow(); return `<div class="tot big"><span>Total (inc GST)</span><span id="tot-total">${aud(t.totalInc)}</span></div>
      <div class="tot note"><span>Includes GST of</span><span>${aud(t.gstInc)}</span></div>
      ${t.deposit ? `<div class="tot dep"><span>Deposit due on acceptance (20%)</span><span>${aud(t.deposit)}</span></div>` : ''}`; };
const imgUrl = (x, size) => API + '/client-quote/' + id + '/image/' + x.id + '?size=' + size;
const orderImages = q => { const im = Array.isArray(q.images) ? q.images : []; return [...im.filter(x => x.line === null || x.line === undefined), ...q.lines.flatMap((l, i) => im.filter(x => x.line === i))]; };
const thumbBtn = (x, cls = '') => `<button type="button" class="img ${x.kind === 'mockup' ? 'mock' : ''} ${cls}" data-img="${ALL.indexOf(x)}" aria-label="Enlarge${x.caption ? ': ' + esc(x.caption) : ''}"><img src="${imgUrl(x, 'thumb')}" alt="${esc(x.caption || (x.kind === 'mockup' ? 'Mock-up' : 'Photo'))}" loading="lazy">${x.kind === 'mockup' ? '<span class="badge">Mock-up</span>' : ''}</button>`;

async function sha256(text) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text.replace(/\r\n/g, '\n')));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const event = type => fetch(API + '/client-quote/' + id + '/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type }) }).catch(() => {});

function termsHtml(text) {
  const out = [];
  let list = null;
  for (const raw of text.replace(/\r\n/g, '\n').split('\n')) {
    const l = raw.trim();
    if (!l) { list = null; continue; }
    if (/^IPD TERMS AND CONDITIONS$/.test(l)) continue;
    if (/^\d+\.\s/.test(l)) { list = null; out.push('<h3>' + esc(l) + '</h3>'); continue; }
    if (/^- /.test(l)) { if (!list) { list = []; out.push(list); } list.push('<li>' + esc(l.slice(2)) + '</li>'); continue; }
    list = null; out.push('<p>' + esc(l) + '</p>');
  }
  return out.map(x => Array.isArray(x) ? '<ul>' + x.join('') + '</ul>' : x).join('');
}

function render() {
  const q = Q, co = TERMS.business, c = q.company || {};
  const name = c.name || co.name, abn = c.abn ? c.abn.replace(/^(\d{2})(\d{3})(\d{3})(\d{3})$/, '$1 $2 $3 $4') : co.abn;
  if (!CHOICE) CHOICE = new Set(q.signed && Array.isArray(q.signed.options) ? q.signed.options : q.lines.map((l, i) => (l.optional && l.defaultOn ? i : -1)).filter(i => i >= 0));
  const hasOpt = q.lines.some(l => l.optional), lockOpt = !!(q.signed || q.expired);
  ALL = orderImages(q);
  let ln = 0; LINKS = []; q.lines.forEach((l, i) => (l.links || []).forEach((k, j) => LINKS.push({ ...k, n: ++ln, line: i, idx: j })));
  const linkList = i => { const ks = LINKS.filter(k => k.line === i); return ks.length ? `<div class="plinks"><div class="plh">Product information</div>${ks.map(k => `<a href="${esc(k.url)}" target="_blank" rel="noopener noreferrer" data-link="${i}:${k.idx}">[${k.n}] ${esc(k.title)} <span>· ${esc(k.type || 'Information')} · ${esc(k.site || '')}</span></a>`).join('')}</div>` : ''; };
  const whole = ALL.filter(x => x.line === null || x.line === undefined);
  const lineImgs = i => ALL.filter(x => x.line === i);
  const lines = q.lines.map((l, i) => { const lk = linkList(i); const cls = [lk ? 'haslinks' : '', l.optional ? 'opt' : '', l.optional && !CHOICE.has(i) ? 'off' : ''].filter(Boolean).join(' ');
    return `<tr data-line="${i}"${cls ? ` class="${cls}"` : ''}><td class="ln">${l.optional ? `<label class="optl"><input type="checkbox" data-opt="${i}"${CHOICE.has(i) ? ' checked' : ''}${lockOpt ? ' disabled' : ''}><span>Optional</span></label>` : ''}${esc(l.name)}${lineImgs(i).length ? `<div class="lthumbs">${lineImgs(i).map(x => thumbBtn(x)).join('')}</div>` : ''}</td><td class="q">${l.qty === 1 ? '' : esc(l.qty)}</td><td class="a" data-amt="${i}">${aud(lineAmt(l, i))}</td></tr>` + (lk ? `<tr class="plrow" data-linkrow="${i}"><td colspan="3">${lk}</td></tr>` : ''); }).join('');
  const s = q.signed;
  $('#app').innerHTML = `${q.practice ? '<div class="practice">🎓 PRACTICE QUOTE: for staff training only. This is not a real quote.</div>' : ''}
    <header class="card">
      <img src="${esc(co.logo)}" alt="IPD logo">
      <div class="co"><b>${esc(name)}</b>ABN ${esc(abn)} · QBCC Licence ${esc(co.qbcc)}<br>${esc(co.address)}<br>${esc(co.phone)} · ${esc(co.email)}</div>
    </header>
    <section class="card">
      <h1>Quote for job #${esc(q.jobNumber)}</h1>
      <div class="meta">
        ${q.client && q.client.name ? `<div>For: ${esc(q.client.name)}</div>` : ''}
        ${q.client && q.client.address ? `<div>${esc(q.client.address)}</div>` : ''}
        <div>Issued ${day(q.issuedAt)} · ${q.expired ? '<b style="color:var(--warn)">Expired ' + day(q.expiresAt) + '</b>' : 'Valid until ' + day(q.expiresAt)}</div>
      </div>
      ${q.description ? (q.descTitle ? `<h3 class="desc-h">${esc(q.descTitle)}</h3>` : '') + `<div class="desc">${esc(q.description)}</div>` : ''}
    </section>
    ${whole.length ? `<section class="card" id="gallery">
      <h2>Photos and mock-ups</h2>
      <div class="gal">${whole.map(x => `<figure>${thumbBtn(x)}${x.caption ? `<figcaption>${esc(x.caption)}</figcaption>` : ''}${x.kind === 'mockup' ? `<div class="mocknote">Mock-up. ${MOCK_NOTE}</div>` : ''}</figure>`).join('')}</div>
      <p class="note">Tap a picture to see it full size.</p>
    </section>` : ''}
    <section class="card">
      <h2>What's included</h2>
      ${hasOpt ? `<p class="opthint">${lockOpt ? (q.signed ? 'The options below show what was chosen when the quote was accepted.' : 'Options are shown as quoted.') : 'Some lines are optional — tick the ones you want and the total updates.'}</p>` : ''}
      <table><tbody>${lines}</tbody></table>
      <div id="totals">${totalsHtml()}</div>
    </section>
    ${stages(q).length ? `<section class="card" id="schedule">
      <h2>Payment schedule</h2>
      <div id="sched">${scheduleHtml()}</div>
    </section>` : ''}
    <section class="card">
      <h2>Key terms</h2>
      <ul class="key">${SHOWN.keyTerms.map(k => '<li>' + esc(k) + '</li>').join('')}</ul>
      <div class="row"><button type="button" id="open-terms">Read the full terms and conditions</button></div>
      <p class="note">Terms version ${SHOWN.version}, ${tday(SHOWN.date)}.</p>
    </section>
    <section class="card ${s ? 'done' : ''}" id="accept">
      ${s ? `<h2>Accepted</h2><p><b>Accepted by ${esc(s.name)}</b> on ${when(s.at)}, under terms version ${esc(s.termsVersion)}${s.termsDate ? ' of ' + tday(s.termsDate) : ''}.${s.totalInc != null ? ` Total accepted: <b>${aud(s.totalInc)}</b> inc GST.` : ''}</p><p class="note">${s.photoOk ? 'Photo permission given.' : 'No photo permission.'} Thank you — we'll be in touch to book the work.</p>`
      : q.expired ? `<h2>This quote has expired</h2><p>Please contact us on ${esc(co.phone)} for an updated quote.</p>`
      : `<h2>Accept this quote</h2>
        <label for="sig-name">Your full name</label>
        <input type="text" id="sig-name" autocomplete="name" maxlength="100">
        <label class="tick"><input type="checkbox" id="sig-agree"><span>I accept this quote and the <a href="#" id="open-terms-2">terms and conditions</a> (version ${TERMS.current.version}).</span></label>
        <label class="tick"><input type="checkbox" id="sig-photo"><span>Optional: you may use photos of the finished work on your website and social media (suburb only, never my name or street address).</span></label>
        <button type="button" class="primary" id="sign">Accept and sign</button>
        <div class="msg" id="sig-msg"></div>`}
    </section>
    <div class="row"><button type="button" id="pdf">Download PDF</button></div>`;
  $('#open-terms').onclick = openTerms;
  const t2 = $('#open-terms-2'); if (t2) t2.onclick = e => { e.preventDefault(); openTerms(); };
  const sg = $('#sign'); if (sg) sg.onclick = sign;
  $('#pdf').onclick = pdf;
  document.querySelectorAll('[data-img]').forEach(b => (b.onclick = () => openViewer(+b.dataset.img)));
  document.querySelectorAll('[data-opt]').forEach(c => c.addEventListener('change', () => {
    const i = +c.dataset.opt; c.checked ? CHOICE.add(i) : CHOICE.delete(i);
    c.closest('tr').classList.toggle('off', !c.checked);
    document.getElementById('totals').innerHTML = totalsHtml();
    document.querySelectorAll('[data-amt]').forEach(td => { const k = +td.dataset.amt; td.textContent = aud(lineAmt(Q.lines[k], k)); });   // a % discount follows the choice
    const sc = document.getElementById('sched'); if (sc) sc.innerHTML = scheduleHtml();
  }));
  // a product link opens in a new tab; this page records it (the client's page stays open)
  document.querySelectorAll('[data-link]').forEach(a => a.addEventListener('click', () => {
    if (staffPreview) return; const [line, link] = a.dataset.link.split(':').map(Number);
    fetch(API + '/client-quote/' + id + '/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'link-opened', line, link }) }).catch(() => {});
  }));
}

// ---- full-screen viewer: swipe left/right, pinch or double-tap to zoom, drag when zoomed
let vAt = 0, vS = 1, vX = 0, vY = 0;
const viewed = new Set();
function vApply() { $('#v-img').style.transform = `translate(${vX}px, ${vY}px) scale(${vS})`; }
function vShow(i) {
  vAt = (i + ALL.length) % ALL.length; vS = 1; vX = 0; vY = 0; vApply();
  const x = ALL[vAt];
  $('#v-img').src = imgUrl(x, 'full'); $('#v-img').alt = x.caption || (x.kind === 'mockup' ? 'Mock-up' : 'Photo');
  $('#v-count').textContent = ALL.length > 1 ? `${vAt + 1} of ${ALL.length}` : '';
  const line = Number.isInteger(x.line) && Q.lines[x.line] ? `<div class="note" style="color:#bbb">For: ${esc(Q.lines[x.line].name)}</div>` : '';
  $('#v-cap').innerHTML = (x.caption ? `<div>${esc(x.caption)}</div>` : '') + (x.kind === 'mockup' ? `<div class="mocknote">Mock-up. ${MOCK_NOTE}</div>` : '') + line;
  $('#v-prev').hidden = $('#v-next').hidden = ALL.length < 2;
  if (!staffPreview && !viewed.has(x.id)) { viewed.add(x.id); fetch(API + '/client-quote/' + id + '/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'image-viewed', imageId: x.id }) }).catch(() => {}); }
}
function openViewer(i) { $('#viewer').classList.add('open'); document.body.style.overflow = 'hidden'; vShow(i); }
function closeViewer() { $('#viewer').classList.remove('open'); document.body.style.overflow = ''; $('#v-img').removeAttribute('src'); }
$('#v-close').onclick = closeViewer;
$('#v-prev').onclick = e => { e.stopPropagation(); vShow(vAt - 1); };
$('#v-next').onclick = e => { e.stopPropagation(); vShow(vAt + 1); };
document.addEventListener('keydown', e => { if (!$('#viewer').classList.contains('open')) return; if (e.key === 'Escape') closeViewer(); if (e.key === 'ArrowLeft') vShow(vAt - 1); if (e.key === 'ArrowRight') vShow(vAt + 1); });
(() => {
  const st = $('#v-stage'); let t0 = null, lastTap = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  st.addEventListener('touchstart', e => {
    if (e.target.closest('.nav')) return;
    const t = e.touches;
    t0 = t.length === 2 ? { pinch: dist(t), s: vS } : { x: t[0].clientX, y: t[0].clientY, vx: vX, vy: vY, at: Date.now() };
  }, { passive: true });
  st.addEventListener('touchmove', e => {
    if (!t0) return; e.preventDefault(); const t = e.touches;
    if (t.length === 2 && t0.pinch) { vS = Math.min(4, Math.max(1, t0.s * dist(t) / t0.pinch)); if (vS === 1) { vX = 0; vY = 0; } vApply(); }
    else if (t.length === 1 && t0.x !== undefined && vS > 1) { vX = t0.vx + t[0].clientX - t0.x; vY = t0.vy + t[0].clientY - t0.y; vApply(); }
  }, { passive: false });
  st.addEventListener('touchend', e => {
    if (!t0) return;
    if (t0.x !== undefined && e.changedTouches.length && e.touches.length === 0) {
      const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y;
      if (vS === 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) vShow(vAt + (dx < 0 ? 1 : -1));
      else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        const now = Date.now();
        if (now - lastTap < 300) { vS = vS > 1 ? 1 : 2.5; vX = 0; vY = 0; vApply(); lastTap = 0; } else lastTap = now;
      }
    }
    if (e.touches.length === 0) t0 = null;
  });
  st.addEventListener('dblclick', () => { vS = vS > 1 ? 1 : 2.5; vX = 0; vY = 0; vApply(); });
})();

let termsLogged = false;
function openTerms() {
  $('#terms').classList.add('open'); document.body.style.overflow = 'hidden';
  if (!termsLogged && !staffPreview) { termsLogged = true; event('terms-opened'); }
}
$('#terms-close').onclick = () => { $('#terms').classList.remove('open'); document.body.style.overflow = ''; };

async function sign() {
  const msg = $('#sig-msg'), btn = $('#sign');
  const name = $('#sig-name').value.trim();
  msg.className = 'msg err';
  if (name.length < 2) { msg.textContent = 'Please type your full name.'; return; }
  if (!$('#sig-agree').checked) { msg.textContent = 'Please tick that you accept the quote and the terms.'; return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
  try {
    const r = await fetch(API + '/client-quote/' + id + '/sign', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, agree: true, photoOk: $('#sig-photo').checked, termsVersion: TERMS.current.version, termsSha: TERMS_SHA, ...(Q.lines.some(l => l.optional) ? { options: [...CHOICE] } : {}) }) });
    const j = await r.json();
    if (!r.ok) { msg.className = 'msg err'; msg.textContent = j.error || 'That did not work. Please try again.'; btn.disabled = false; return; }
    Q.signed = j.signed; SHOWN = await shownTerms(); showTermsPanel(); render(); $('#accept').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { msg.className = 'msg err'; msg.textContent = 'No connection. Please try again.'; btn.disabled = false; }
}

function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function logoData() {
  if (LOGO) return LOGO;
  const b = await (await fetch(TERMS.business.logo)).blob();
  LOGO = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
  return LOGO;
}
async function pdf() {
  const btn = $('#pdf'); btn.disabled = true; btn.textContent = 'Making the PDF…';
  try {
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const doc = await buildPdf(new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }), await logoData());
    doc.save('IPD-quote-' + Q.jobNumber + '.pdf');
    if (!staffPreview) event('pdf-downloaded');
  } catch (e) { alert('The PDF could not be made. Please try again.'); }
  btn.disabled = false; btn.textContent = 'Download PDF';
}
// An image for the PDF: the full-size picture scaled to 1,000 px (keeps the PDF small enough to email).
async function pdfImage(x) {
  const blob = await (await fetch(imgUrl(x, 'full'))).blob();
  const src = window.createImageBitmap ? await createImageBitmap(blob) : await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(blob); });
  const k = Math.min(1, 1000 / Math.max(src.width, src.height)), c = document.createElement('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return { data: c.toDataURL('image/jpeg', 0.75), w: c.width, h: c.height };
}
async function buildPdf(doc, logo) {
  const q = Q, co = TERMS.business, c = q.company || {}, s = q.signed;
  const name = c.name || co.name, abn = c.abn ? c.abn.replace(/^(\d{2})(\d{3})(\d{3})(\d{3})$/, '$1 $2 $3 $4') : co.abn;
  const L = 15, R = 195, W = R - L, BOTTOM = 280;
  let y = 15;
  const need = h => { if (y + h > BOTTOM) { doc.addPage(); y = 18; } };
  const para = (text, size = 10, style = 'normal', indent = 0) => {
    doc.setFont('helvetica', style); doc.setFontSize(size);
    for (const ln of doc.splitTextToSize(String(text), W - indent)) { need(size * 0.45); doc.text(ln, L + indent, y); y += size * 0.45; }
  };
  // header: logo, company, ABN, QBCC
  doc.addImage(logo, 'JPEG', L, y, 26, 27);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.text(name, 46, y + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  [`ABN ${abn}  ·  QBCC Licence ${co.qbcc}`, co.address, `${co.phone}  ·  ${co.email}`, co.website].forEach((t, i) => doc.text(t, 46, y + 11 + i * 4.6));
  y += 33; doc.setDrawColor(200); doc.line(L, y, R, y); y += 8;
  para(`Quote for job #${q.jobNumber}`, 15, 'bold'); y += 1;
  if (q.client && q.client.name) para('For: ' + q.client.name, 10);
  if (q.client && q.client.address) para(q.client.address, 10);
  para(`Issued ${day(q.issuedAt)}  ·  Valid until ${day(q.expiresAt)}`, 10);
  if (q.description) { y += 3; if (q.descTitle) para(q.descTitle, 11, 'bold'); para(q.description, 10); }
  y += 5;
  // lines
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); need(8);
  doc.text('Item', L, y); doc.text('Qty', 160, y, { align: 'right' }); doc.text('Amount', R, y, { align: 'right' }); y += 2; doc.line(L, y, R, y); y += 5;
  doc.setFont('helvetica', 'normal');
  q.lines.forEach((l, i) => {
    const parts = doc.splitTextToSize(l.name, 128); need(parts.length * 4.5 + 2);
    const off = l.optional && !CHOICE.has(i);
    if (off) doc.setTextColor(140);
    doc.text(parts, L, y); doc.text(String(l.qty), 160, y, { align: 'right' }); doc.text(aud(lineAmt(l, i)).replace('−', '-'), R, y, { align: 'right' });
    y += parts.length * 4.5 + 2;
    if (l.optional) { doc.setFontSize(8.5); doc.text(off ? 'Optional — not included' : 'Optional — included', L + 4, y - 1); doc.setFontSize(10); y += 3.5; }
    doc.setTextColor(0);
    for (const k of LINKS.filter(k => k.line === i)) {
      const t = doc.splitTextToSize(`[${k.n}] ${k.title} – ${k.type || 'Information'}`, 120)[0];
      need(5); doc.setFontSize(9); doc.setTextColor(26, 86, 176); doc.textWithLink(t, L + 4, y - 0.5, { url: k.url }); doc.setTextColor(0); doc.setFontSize(10); y += 4.2;
    }
  });
  doc.line(L, y - 2, R, y - 2); y += 4; need(20);
  const TT = totalsNow();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('Total (inc GST)', 120, y); doc.text(aud(TT.totalInc), R, y, { align: 'right' }); y += 5.5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text('Includes GST of', 120, y); doc.text(aud(TT.gstInc), R, y, { align: 'right' }); y += 5;
  if (TT.deposit) { doc.setFont('helvetica', 'bold'); doc.text('Deposit due on acceptance (20%)', 120, y); doc.text(aud(TT.deposit), R, y, { align: 'right' }); y += 5; }
  y += 6;
  if (stages(q).length) {
    para('Payment schedule', 12, 'bold'); y += 1;
    const row = (label, amt, sub) => { const parts = doc.splitTextToSize(label, 140); need(parts.length * 4.5 + (sub ? 4 : 0) + 2); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.text(parts, L, y); doc.text(aud(amt), R, y, { align: 'right' }); y += parts.length * 4.5;
      if (sub) { doc.setFontSize(8.5); doc.setTextColor(110); doc.text(sub, L, y); doc.setTextColor(0); y += 4; } y += 2; };
    if (TT.deposit) row('Deposit, due on acceptance', TT.deposit);
    TT.stages.forEach((x, i) => row(`Stage ${i + 1}: ${x.name}`, x.amountInc, 'Invoiced when this stage is complete'));
    doc.line(L, y - 2, R, y - 2); y += 3; doc.setFont('helvetica', 'bold'); doc.text('Total (inc GST)', L, y); doc.text(aud(TT.totalInc), R, y, { align: 'right' }); y += 8;
  }
  para('Key terms', 12, 'bold'); y += 1;
  for (const k of SHOWN.keyTerms) { need(5); doc.setFontSize(9.5); doc.text('•', L + 1, y); para(k, 9.5, 'normal', 5); y += 1; }
  y += 3;
  if (s) { para(`${signedLine(s)} ${s.photoOk ? 'Photo permission given.' : 'No photo permission.'}`, 10, 'bold'); }
  else { para('To accept, open your quote link and sign, or contact us. The full terms and conditions follow.', 9.5, 'italic'); }
  // photos and mock-ups: whole quote first, then each line's (2 per row; a mock-up gets the full width)
  if (ALL.length) {
    doc.addPage(); y = 18;
    para('Photos and mock-ups', 13, 'bold'); y += 2;
    const groups = [{ title: '', items: ALL.filter(x => !Number.isInteger(x.line)) }, ...q.lines.map((l, i) => ({ title: 'For: ' + l.name, items: ALL.filter(x => x.line === i) }))].filter(g => g.items.length);
    const GAP = 6, HALF = (W - GAP) / 2;
    for (const g of groups) {
      if (g.title) { y += 2; need(14); para(g.title, 10.5, 'bold'); y += 1.5; }
      let col = 0, rowTop = y, rowH = 0;
      const endRow = () => { if (col) { y = rowTop + rowH; col = 0; rowH = 0; } };
      for (const x of g.items) {
        let im = null; try { im = await pdfImage(x); } catch (e) {}
        const wide = x.kind === 'mockup', boxW = wide ? W : HALF, maxH = wide ? 150 : 78;
        let iw = boxW, ih = im ? boxW * im.h / im.w : 20; if (ih > maxH) { ih = maxH; iw = im ? ih * im.w / im.h : boxW; }
        doc.setFontSize(9); const cap = x.caption ? doc.splitTextToSize(x.caption, boxW) : [];
        doc.setFontSize(8.5); const mk = wide || x.kind === 'mockup' ? doc.splitTextToSize('Mock-up. ' + MOCK_NOTE, boxW) : [];
        const h = ih + 3 + cap.length * 4 + mk.length * 3.8 + 5;
        if (wide) endRow();
        if (!col) { if (y + h > BOTTOM) { doc.addPage(); y = 18; } rowTop = y; }
        const x0 = col ? L + HALF + GAP : L;
        if (im) doc.addImage(im.data, 'JPEG', x0, rowTop, iw, ih); else { doc.setDrawColor(200); doc.rect(x0, rowTop, boxW, ih); doc.setFontSize(9); doc.text('(picture could not be loaded)', x0 + 3, rowTop + 10); }
        let ty = rowTop + ih + 4;
        if (cap.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(0); doc.text(cap, x0, ty); ty += cap.length * 4; }
        if (mk.length) { doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(163, 59, 0); doc.text(mk, x0, ty); doc.setTextColor(0); doc.setFont('helvetica', 'normal'); }
        if (wide) { y = rowTop + h; continue; }
        rowH = Math.max(rowH, h);
        if (col) { y = rowTop + rowH; col = 0; rowH = 0; } else col = 1;
      }
      endRow();
    }
  }
  // product information links: full addresses, readable on paper and tappable on screen
  if (LINKS.length) {
    doc.addPage(); y = 18;
    para('Product information links', 13, 'bold'); y += 2;
    for (const k of LINKS) {
      need(12); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text(`[${k.n}] ${doc.splitTextToSize(k.title + ' – ' + (k.type || 'Information'), W - 10)[0]}`, L, y); y += 4.6;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(26, 86, 176);
      for (const seg of doc.splitTextToSize(k.url, W - 6)) { need(4.4); doc.textWithLink(seg, L + 4, y, { url: k.url }); y += 4.2; }
      doc.setTextColor(0); y += 2.5;
    }
  }
  // full terms
  doc.addPage(); y = 18;
  para(`Terms and conditions (version ${SHOWN.version}, ${tday(SHOWN.date)})`, 13, 'bold'); y += 2;
  for (const raw of SHOWN.text.replace(/\r\n/g, '\n').split('\n')) {
    const l = raw.trim();
    if (!l || l === 'IPD TERMS AND CONDITIONS') { y += 1; continue; }
    if (/^\d+\.\s/.test(l)) { y += 2; need(10); para(l, 10.5, 'bold'); }
    else if (/^- /.test(l)) { need(5); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text('•', L + 1, y); para(l.slice(2), 9.5, 'normal', 5); }
    else para(l, 9.5);
  }
  // footer on every page
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
    doc.text(`${name}  ·  ABN ${abn}  ·  QBCC Licence ${co.qbcc}  ·  ${co.address}`, 105, 286, { align: 'center' });
    doc.text(`${co.phone}  ·  ${co.email}  ·  Quote job #${q.jobNumber}  ·  Page ${i} of ${n}`, 105, 290, { align: 'center' });
    doc.setTextColor(0);
  }
  return doc;
}

(async () => {
  if (!/^[0-9a-f-]{36}$/.test(id)) { $('#app').innerHTML = '<div class="center">This quote link is not complete. Please open the link from your message again.</div>'; return; }
  try {
    const [t, txt] = await Promise.all([fetch('terms/ipd-terms.json', { cache: 'no-store' }).then(r => r.json()), fetch('terms/ipd-terms.txt', { cache: 'no-store' }).then(r => r.text())]);
    TERMS = t; TERMS_TEXT = txt; TERMS_SHA = await sha256(txt);
    const r = await fetch(API + '/client-quote/' + id + '/view', { headers: staffPreview ? { 'x-staff-preview': '1' } : {} });
    const j = await r.json();
    if (!r.ok) { $('#app').innerHTML = '<div class="center">' + esc(j.error || 'This quote could not be loaded.') + '</div>'; return; }
    Q = j; SHOWN = await shownTerms(); showTermsPanel(); render();
  } catch (e) { $('#app').innerHTML = '<div class="center">Your quote could not be loaded. Please check your connection and try again.</div>'; }
})();
